<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so env(safe-area-inset-*) resolves and the card can
     clear the notch and home indicator. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00220A">
<title>Joe Parker-Rees — Digital Business Card</title>
<meta name="description" content="Product designer and developer, Brighton UK. Tilt to look around.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://joeparkerrees.co.uk/card">
<meta property="og:title" content="Joe Parker-Rees">
<meta property="og:description" content="Product designer and developer, Brighton UK.">
<link rel="preload" href="fonts/Octave-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>
</head>
<body>

<!-- The dark green field. Holds the perspective, so the card tilts within it. -->
<main class="stage">

  <article class="card" id="card">

    <!-- Dark window. The relief is cream cubes, which need somewhere dark to
         sit — against the card's own light ground they would vanish. -->
    <!-- The frame exists so the seal can overhang the window's corner: the
         window itself clips its contents, and the seal must not be clipped. -->
    <div class="frame">
      <div class="window" id="sculpt-window">
        <canvas id="head-canvas"></canvas>

        <p class="hint tracking-ui" id="hint">Drag to look around</p>
        <button class="cta" id="motion-btn" hidden>
          <span class="cta__border" aria-hidden="true"></span>
          <span class="cta__face tracking-ui">Tilt to look around</span>
        </button>
      </div>

      <!-- Foil seal, straddling the window edge like an authenticity sticker.
           Its glint is driven by the same tilt values as the relief, so the
           two read as one object rather than two effects sharing a card. -->
      <div class="badge" id="badge">
        <span class="badge__foil" aria-hidden="true"></span>
        <span class="badge__shade" aria-hidden="true"></span>
        <span class="badge__grain" aria-hidden="true"></span>
        <span class="badge__sheen" aria-hidden="true"></span>
      </div>
    </div>

    <div class="card__body">

      <div class="identity">
        <h1 class="name">Joe Parker-Rees</h1>
      </div>

      <p class="bio">
        My name is Joe and I create work that matters with craft + curiosity.
      </p>

      <a class="email" href="mailto:joe@joeparkerrees.com">joe@joeparkerrees.com</a>

      <div class="handoff">
        <img class="qr" id="qr-img" src="qr-url.svg" alt="QR code linking to this card" width="300" height="300" decoding="async">

        <div class="handoff__side">
          <div class="switch tracking-ui" id="qr-switch" role="tablist" aria-label="QR code contents" data-active="0">
            <span class="switch__thumb" aria-hidden="true"></span>
            <button role="tab" id="tab-url" aria-selected="true" data-qr="qr-url.svg" data-label="QR code linking to this card">This card</button>
            <button role="tab" id="tab-vcard" aria-selected="false" data-qr="qr-vcard.svg" data-label="QR code containing contact details">Save contact</button>
          </div>
        </div>
      </div>

      <div class="footline tracking-ui">
        <span>BRIGHTON, UK</span>
        <span>joeparkerrees.co.uk</span>
      </div>

    </div>

  </article>

</main>

<!--
  iOS Safari does not implement navigator.vibrate. The only lever available to
  a web page is this: toggling a `switch` checkbox produces system haptic
  feedback on iOS 17.4+. It is a workaround, not an API, so it is kept
  offscreen and driven programmatically. Android uses navigator.vibrate.
-->
<input type="checkbox" switch id="haptic-switch" class="haptic-switch" aria-hidden="true" tabindex="-1">

<script type="module" src="card.js"></script>
</body>
</html>
