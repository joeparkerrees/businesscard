<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover so env(safe-area-inset-*) resolves and the sculpture
     genuinely bleeds behind the notch and home indicator. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFEFC">
<title>Joe Parker-Rees — Digital Business Card</title>
<meta name="description" content="Product designer and developer, Brighton UK. Tilt to look around.">
<meta property="og:type" content="website">
<meta property="og:title" content="Joe Parker-Rees">
<meta property="og:description" content="Product designer and developer, Brighton UK.">
<link rel="preload" href="fonts/Octave-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>
</head>
<body>

<!-- Full bleed: the sculpture is the page, everything else sits over it. -->
<canvas id="head-canvas"></canvas>

<!-- Scrims keep the overlaid type legible where it crosses the point cloud,
     without boxing the sculpture into a card. -->
<div class="scrim scrim--top" aria-hidden="true"></div>
<div class="scrim scrim--bottom" aria-hidden="true"></div>

<main class="overlay">

  <header class="top">
    <div>
      <h1 class="top__name">Joe<br>Parker-Rees</h1>
      <p class="top__place tracking-ui">Brighton, UK</p>
    </div>

    <!-- Foil seal. The glint is driven by the same tilt values as the
         sculpture, so the two read as one physical object rather than as two
         effects that happen to share a screen. -->
    <div class="badge" id="badge">
      <span class="badge__foil" aria-hidden="true"></span>
      <span class="badge__grain" aria-hidden="true"></span>
      <span class="badge__sheen" aria-hidden="true"></span>
      <span class="badge__label tracking-ui">JPR</span>
    </div>
  </header>

  <div class="bottom">

    <p class="bio">
      Digital designer and developer. I design products and then build them —
      a native iOS app, brand systems, and the occasional water shader.
    </p>

    <a class="email" href="mailto:joe@joeparkerrees.com">joe@joeparkerrees.com</a>

    <div class="handoff">
      <div class="qr">
        <img class="qr__img" id="qr-img" src="qr-url.svg" alt="QR code linking to this card" width="300" height="300" decoding="async">
      </div>

      <div class="handoff__side">
        <div class="qr__switch tracking-ui" role="tablist" aria-label="QR code contents">
          <button role="tab" id="tab-url" aria-selected="true" data-qr="qr-url.svg" data-label="QR code linking to this card">This card</button>
          <button role="tab" id="tab-vcard" aria-selected="false" data-qr="qr-vcard.svg" data-label="QR code containing contact details">Save contact</button>
        </div>
        <p class="handoff__hint tracking-ui" id="qr-caption">Scan to open this card</p>
        <button class="cta" id="motion-btn" hidden>
          <span class="cta__border" aria-hidden="true"></span>
          <span class="cta__face tracking-ui">Tilt to look around</span>
        </button>
        <p class="hint tracking-ui" id="hint">Drag to look around</p>
      </div>
    </div>

  </div>

</main>

<!--
  iOS Safari does not implement navigator.vibrate. The only lever available to
  a web page is this: toggling a `switch` checkbox produces system haptic
  feedback on iOS 17.4+. It is a workaround, not an API, so it is kept
  offscreen and driven programmatically. Android uses navigator.vibrate.
-->
<input type="checkbox" switch id="haptic-switch" class="haptic-switch" aria-hidden="true" tabindex="-1">

<script type="module" src="card.js"></script>
</body>
</html>
